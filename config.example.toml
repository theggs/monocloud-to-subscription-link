# Relative paths are resolved against this configuration file's directory.
# Copy this file to .local/config.toml to keep private settings out of Git.
data_dir = "data"

# Optional explicit official template snapshot (no automatic fallback/refresh).
# Directory must contain update.json and Clash_ss; size/SHA-256 are still checked.
# template_dir = "official-template"

# Optional override; otherwise the token is stored at data_dir/token.json.
# token_file = "credentials/token.json"

[monocloud]
base_url = "https://api.bluecloudworks.com"
user_agent = "MonocloudGO-1.0.1"
client_version = "1.0.1"
# These request headers match the client used for read-only API verification.
# Override them if the API's requirements change.
# Client credentials are required only for password-grant login.
# Configure actual values privately; never commit them.
# client_id = ""
# client_secret = ""

[clash]
mixed_port = 7890

[tailscale]
enabled = false
# These values configure the CLIENT, not the subscription server.
# hostname = "example-phone"
# state_dir = "tailscale" # Preserve this directory across client restarts.
# auth_key = ""          # Optional; otherwise the core logs an authorization URL.
# control_url = "https://controlplane.tailscale.com"
# routes = ["192.168.50.0/24"] # Optional explicit Tailnet subnet routes.

[server]
host = "127.0.0.1"
port = 8080
# For phones, use a reachable LAN hostname/IP or your HTTPS reverse proxy URL.
# public_url = "https://subscriptions.example.invalid"

[subscription]
# Optional private override; otherwise a random key is generated and persisted.
# Use a cryptographically random URL-safe value, 32-128 characters.
# key = ""
