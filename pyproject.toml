[project]
name = "monocloud-to-subscription-link"
version = "0.1.0"
description = "Generate MonoCloud client subscriptions with Tailscale support."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx[socks]>=0.28,<1",
    "pyyaml>=6,<7",
    "uvicorn>=0.34,<1",
]

[project.scripts]
monocloud-subscription = "monocloud_subscription.cli:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "monocloud_subscription"

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
