services:
  subscription:
    build: .
    image: monocloud-subscription:local
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    restart: unless-stopped
    stop_grace_period: 35s
    env_file:
      - .local/service.env
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ./.local/container.toml
        target: /config/config.toml
        read_only: true
        bind:
          create_host_path: false
      - ${DATA_DIR:-subscription-data}:/data

volumes:
  subscription-data:
